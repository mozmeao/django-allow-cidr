[tox]
envlist =
    py{3.10,3.11,3.12}-django42
    py{3.10,3.11,3.12,3.13,3.14}-django52
    py{3.12,3.13,3.14}-django60
    py3.13-flake8

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/allow_cidr
commands = python runtests.py
deps =
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
basepython =
    py3.14: python3.14
    py3.13: python3.13
    py3.12: python3.12
    py3.11: python3.11
    py3.10: python3.10

[testenv:py3.13-flake8]
commands = flake8
deps = flake8
